name: Build All & Auto Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= 编译部分 =================
  build-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with: { packages: '' }
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-30" "build-tools;30.0.3" "platform-tools"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.NAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "OK: Release keystore decoded"
          else
            echo "WARN: NAS_KEYSTORE_BASE64 not set, fallback to debug signing"
          fi
      - name: Sync Version & Build
        env:
          NAS_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          NAS_KEYSTORE_PASSWORD: ${{ secrets.NAS_KEYSTORE_PASSWORD }}
          NAS_KEY_ALIAS: ${{ secrets.NAS_KEY_ALIAS }}
          NAS_KEY_PASSWORD: ${{ secrets.NAS_KEY_PASSWORD }}
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K[0-9a-zA-Z\.-]+' CHANGELOG.md | head -1)
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/android-nas-server-v${VERSION}.apk
      - uses: actions/upload-artifact@v4
        with: { name: server-apk, path: app/build/outputs/apk/release/*.apk }

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.NAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "OK: Release keystore decoded"
          else
            echo "WARN: NAS_KEYSTORE_BASE64 not set, fallback to debug signing"
          fi
      - name: Build
        env:
          NAS_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          NAS_KEYSTORE_PASSWORD: ${{ secrets.NAS_KEYSTORE_PASSWORD }}
          NAS_KEY_ALIAS: ${{ secrets.NAS_KEY_ALIAS }}
          NAS_KEY_PASSWORD: ${{ secrets.NAS_KEY_PASSWORD }}
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K[0-9a-zA-Z\.-]+' CHANGELOG.md | head -1)
          cd client && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/android-nas-client-v${VERSION}.apk
      - uses: actions/upload-artifact@v4
        with: { name: client-apk, path: client/app/build/outputs/apk/release/*.apk }

  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Decode Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.NAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "OK: Release keystore decoded"
          else
            echo "WARN: NAS_KEYSTORE_BASE64 not set, fallback to debug signing"
          fi
      - name: Build
        env:
          NAS_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          NAS_KEYSTORE_PASSWORD: ${{ secrets.NAS_KEYSTORE_PASSWORD }}
          NAS_KEY_ALIAS: ${{ secrets.NAS_KEY_ALIAS }}
          NAS_KEY_PASSWORD: ${{ secrets.NAS_KEY_PASSWORD }}
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K[0-9a-zA-Z\.-]+' CHANGELOG.md | head -1)
          cd tv && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/android-nas-tv-v${VERSION}.apk
      - uses: actions/upload-artifact@v4
        with: { name: tv-apk, path: tv/app/build/outputs/apk/release/*.apk }

  build-pc:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: gui, artifact: desktop-linux, os_name: linux }
          - { os: windows-latest, target: gui, artifact: desktop-windows, os_name: windows }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install Dependencies
        run: pip install 'requests>=2.28,<3' 'pyinstaller>=5.13,<6' 'pystray' 'pillow'
      - name: Build GUI
        if: matrix.target == 'gui'
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K[0-9a-zA-Z\.-]+' CHANGELOG.md | head -1)
          cd desktop && pyinstaller -F -w nas_client.py -n nas-client-${{ matrix.os_name }}-v${VERSION}
      - name: Build CLI
        if: matrix.target == 'cli'
        shell: bash
        run: |
          python sync_version.py
          VERSION=$(grep -oP '##\s*\[?v?\K[0-9a-zA-Z\.-]+' CHANGELOG.md | head -1)
          cd cli && pyinstaller -F nas_cli.py -n nas-cli-${{ matrix.os_name }}-v${VERSION}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.target == 'gui' && 'desktop/dist/*' || 'cli/dist/*' }}

  # ================= 自动发布部分 =================
  auto-release:
    needs: [build-server, build-client, build-tv, build-pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and Create Tag
        id: check_tag
        run: |
          VERSION=$(grep -oP '##\s*\[?v?\K[0-9a-zA-Z\.-]+' CHANGELOG.md | head -1)
          if [ -z "$VERSION" ]; then
            echo "skip_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION 已存在，跳过发布。"
            echo "skip_release=true" >> $GITHUB_OUTPUT
          else
            echo "发现新版本 v$VERSION，开始发版流程！"
            echo "skip_release=false" >> $GITHUB_OUTPUT
            echo "version=v$VERSION" >> $GITHUB_OUTPUT
            git config user.name "GitHub Action"
            git config user.email "action@github.com"
            git tag -a "v$VERSION" -m "Auto Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check_tag.outputs.skip_release == 'false'
        with:
          path: ./all_artifacts

      # ======= 核心升级：高容错重命名平铺 =======
      - name: Prepare Standalone Files
        if: steps.check_tag.outputs.skip_release == 'false'
        run: |
          mkdir -p release_files
          VERSION="${{ steps.check_tag.outputs.version }}"
          
          # 使用 find 严格只提取文件 (-type f)，防止误抓目录导致 Release 失败
          # 安卓端
          find ./all_artifacts/server-apk -type f -name "*.apk" -exec cp {} release_files/AndroidNAS-Server-$VERSION.apk \; || true
          find ./all_artifacts/client-apk -type f -name "*.apk" -exec cp {} release_files/AndroidNAS-Client-$VERSION.apk \; || true
          find ./all_artifacts/tv-apk -type f -name "*.apk" -exec cp {} release_files/AndroidNAS-TV-$VERSION.apk \; || true
          
          # PC端 Windows
          find ./all_artifacts/desktop-windows -type f -name "*.exe" -exec cp {} release_files/AndroidNAS-Desktop-Windows-$VERSION.exe \; || true
          
          # PC端 Linux (不带后缀)
          find ./all_artifacts/desktop-linux -type f -exec cp {} release_files/AndroidNAS-Desktop-Linux-$VERSION \; || true
          
          # 额外生态
          
          echo "====== 即将发布的文件列表 ======"
          ls -la release_files/

      - name: Extract Release Notes
        if: steps.check_tag.outputs.skip_release == 'false'
        run: |
          VERSION=$(grep -oP '##\s*\[?v?\K[0-9a-zA-Z\.\-]+' CHANGELOG.md | head -1)
          awk '/^## \[/{count++} count==1{print}' CHANGELOG.md | tail -n +2 > changelog_body.md
          {
            echo "## 👑 Android NAS Lite v${VERSION} 正式发布！"
            echo ""
            echo "**把吃灰的 Android 手机变成一个干净、稳定、可长期挂机的局域网文件服务器。**"
            echo ""
            echo "这是 Android NAS 的精简版，基于完整版剥离了高风险与低使用率功能，只保留最核心的文件服务。"
            echo ""
            echo "---"
            echo ""
            echo "### 🚀 核心更新亮点"
            echo ""
            cat changelog_body.md
            echo ""
            echo "---"
            echo ""
            echo "### 📦 安装包下载指南 (Assets)"
            echo ""
            echo "请直接点击下方对应的文件下载（所有端版本号均已同步）："
            echo ""
            echo "- 📱 **服务端 (旧手机)**：\`AndroidNAS-Server-v${VERSION}.apk\`"
            echo "- 🖥️ **手机客户端 (主力机)**：\`AndroidNAS-Client-v${VERSION}.apk\`"
            echo "- 📺 **TV 电视端**：\`AndroidNAS-TV-v${VERSION}.apk\`"
            echo "- 💻 **Windows GUI**：\`AndroidNAS-Desktop-Windows-v${VERSION}.exe\`"
            echo "- 🐧 **Linux GUI**：\`AndroidNAS-Desktop-Linux-v${VERSION}\`"
            echo ""
            echo "---"
            echo ""
            echo "### ⚠️ 安全提示"
            echo ""
            echo "1. **明文传输**：局域网默认明文 HTTP。请勿将端口直接暴露公网，公网访问请自行配置 TLS 穿透。"
            echo "2. **账号限制**：系统仅保留 \`admin\` 与 \`guest\` 双账号。"
            echo "3. **保活边界**：Lite 版不包含激进保活。若掉线请将应用设为“无限制”。"
            echo ""
            echo "---"
            echo ""
            echo "**Enjoy your personal cloud! 如果觉得项目对你有帮助，欢迎点一个 ⭐ Star！**"
          } > release_notes.md

      - name: Create GitHub Release
        if: steps.check_tag.outputs.skip_release == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.version }}
          files: release_files/*
          body_path: release_notes.md
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
