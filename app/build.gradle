apply plugin: 'com.android.application'

android {
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.androidnas.lite.server"
        minSdkVersion 8
        targetSdkVersion 22
        versionCode 40200
        versionName "4.2.0-lite.1"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("NAS_KEYSTORE_PATH")
            if (ksPath && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("NAS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NAS_KEY_ALIAS")
                keyPassword System.getenv("NAS_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            if (System.getenv("NAS_KEYSTORE_PATH") && file(System.getenv("NAS_KEYSTORE_PATH")).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.2.0'
}
